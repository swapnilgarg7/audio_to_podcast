stage_id: podcast_publish
tier: process
lifecycle:
  phases:
  - prestage
  - pre_call
  - execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: publish/package_ready.json
  schema: null
  staging: false
- path: publish/publish_result.json
  staging: true
- path: publish/chapters.json
  staging: true
- path: publish/transcript.vtt
  staging: true
- path: publish/episode.json
  staging: true
- path: publish/description.txt
  staging: true
inputs:
  hard:
  - path: master/master.wav
    producer: master_finalize
  - path: publish/audio.mp3
    producer: podcast_encode_mp3
  - path: publish/cover.jpg
    producer: episode_cover_generate
  - path: master/transcript.vtt
    producer: master_transcript_build
  soft:
  - path: master/edl.json
    producer: edl
  - path: master/selection.json
    producer: full_master_ranking
  - path: master/narrative_plan.json
    producer: narrative_arc_plan
  - path: publish/episode_meta.json
    producer: episode_meta_build
  - path: publish/cover_meta.json
    producer: episode_cover_generate
sufficiency: []
propagation:
  invalidates_stages: []
consumers: []
remediation:
  strategies:
  - volley_retry
  - full_stage_rerun
