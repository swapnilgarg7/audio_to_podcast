stage_id: transcribe
tier: process
lifecycle:
  phases:
  - prestage
  - pre_call
  - execute
  - staged_validate
  - committed
  - post_commit_validate
outputs:
- path: transcript/full.json
  schema: null
  staging: false
- path: transcript/speakers.json
  staging: true
inputs:
  hard:
  - path: ingest/normalized.wav
    producer: ingest
  soft: []
sufficiency: []
propagation:
  invalidates_stages: []
consumers:
- audio_probe_build
- transcript_review_build
- source_acoustic_profile
- interview_spine_build
- speaker_roles
- content_context
- segment_classification
- nugget_corpus_mine
remediation:
  strategies:
  - full_stage_rerun
